---


##################
# LOAD VARIABLES #
##################

- name: "[LOAD VARIABLES]"
  import_playbook: playbooks/load_distro_vars.yml
  tags:
    - always

####################
# POST INSTALACION #
####################

- name: "[POST_INSTALL] environment, docker and git"
  hosts: localhost
  connection: local
  become: false
  vars:
    disable_updates: "{{ lookup('env', 'REPO_DISABLE_UPDATES') | default(false) | bool }}"
    ansible_user: "{{ lookup('env', 'USER') }}"
    ansible_user_dir: "{{ lookup('env', 'HOME') }}"
  tasks:
    - name: "check if 'roles/post_install/defaults/main.yml' exists"
      stat:
        path: "{{ playbook_dir }}/roles/post_install/defaults/main.yml"
      register: post_install_defaults

    - name: "the roles' defaults must be decrypted"
      fail:
        msg: "YOU MUST TO DECRYPT '{{ playbook_dir }}/roles/post_install/defaults/main.yml.gpg"
      when: not post_install_defaults.stat.exists

    - name: "[POST_INSTALL] {{ post_install_file }}"
      include_role:
        name: post_install
        tasks_from: "{{ post_install_file }}"
      loop:
        - environment.yml
        - wsl_ssh_agent.yml
        - docker.yml
        - git.yml
        - netbird.yml
      loop_control:
        loop_var: post_install_file

###############
# WORK CONFIG #
###############

- name: "[WORK] environment, docker and git"
  hosts: localhost
  connection: local
  become: false
  vars:
    disable_updates: "{{ lookup('env', 'REPO_DISABLE_UPDATES') | default(false) | bool }}"
    ansible_user: "{{ lookup('env', 'USER') }}"
    ansible_user_dir: "{{ lookup('env', 'HOME') }}"
  tasks:
    - name: "check if 'roles/work/defaults/main.yml' exists"
      stat:
        path: "{{ playbook_dir }}/roles/work/defaults/main.yml"
      register: work_defaults

    - name: "the roles' defaults must be decrypted"
      fail:
        msg: "YOU MUST TO DECRYPT '{{ playbook_dir }}/roles/work/defaults/main.yml.gpg"
      when: not work_defaults.stat.exists

    - name: "[WORK] {{ work_file }}"
      include_role:
        name: work
        tasks_from: "{{ work_file }}"
      loop:
        - environment.yml
        - docker.yml
        - git.yml
      loop_control:
        loop_var: work_file
