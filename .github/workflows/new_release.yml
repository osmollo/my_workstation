name: New Release

on:
  push:
    branches: [master]
    paths:
      - release.json
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  create_release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(jq -er '.version | strings | select(length > 0)' release.json)"
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END {
              if (!found) {
                print "No changelog section found for version " heading > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md

          test -s release-notes.md
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ steps.release.outputs.version }}
          name: Release v${{ steps.release.outputs.version }}
          bodyFile: release-notes.md
