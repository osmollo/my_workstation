---

- name: "[OPENCODE] delete config directory"
  file:
    path: "{{ ansible_user_dir }}/.config/opencode"
    state: absent

- name: "[OPENCODE] create link to config directory"
  file:
    src: "{{ megasync_dir }}/backups/opencode"
    dest: "{{ ansible_user_dir }}/.config/opencode"
    state: link
