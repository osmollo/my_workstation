---

- name: "[ENVIRONMENT] configure ssh entries"
  blockinfile:
    path: "{{ ansible_user_dir }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ item.name }} #"
    block: |
      Host {{ item.name }}
        ForwardAgent yes
      {% if item.serveraliveinternal is defined %}
        ServerAliveInternal {{ item.serveraliveinternal }}
      {% endif %}
      {% if item.serveralivecountmax is defined %}
        ServerAliveCountMax {{ item.serveralivecountmax }}
      {% endif %}
      {% if item.stricthostkeychecking is defined %}
        StrictHostKeyChecking {{ item.stricthostkeychecking }}
      {% endif %}
      {% if item.forwardagent is defined %}
        ForwardAgent {{ item.forwardagent }}
      {% endif %}
      {% if item.hostname is defined %}
        Hostname {{ item.hostname }}
      {% endif %}
      {% if item.user is defined %}
        User {{ item.user }}
      {% endif %}
      {% if item.identity_file is defined %}
        IdentityFile {{ item.identity_file }}
      {% endif %}
      {% if item.type is defined %}
        IdentityFile ~/.ssh/securitas_rsa
        PubkeyAcceptedKeyTypes {{ item.type }}
        HostKeyAlgorithms {{ item.type }}
      {% endif %}
        IdentityAgent ~/.1password/agent.sock
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0600
  loop: "{{ ssh_config_entries }}"

- name: "[ENVIRONMENT] change policy"
  become: true
  command: update-crypto-policies --set LEGACY
  changed_when: false
  when: 
    - linux_distribution != "arch"
    - not is_wsl

- name: "[ENVIRONMENT] WSL: ssh config on the Windows side (ssh.exe/scp.exe do not read ~/.ssh/config)"
  when: is_wsl
  block:
    - name: "[ENVIRONMENT] get Windows user profile"
      shell: "cmd.exe /c 'echo %USERPROFILE%' 2>/dev/null | tr -d '\\r'"
      args:
        chdir: /mnt/c
      register: win_profile
      changed_when: false

    - name: "[ENVIRONMENT] get Windows user profile path in WSL"
      command: "wslpath -u '{{ win_profile.stdout }}'"
      register: win_profile_unix
      changed_when: false

    - name: "[ENVIRONMENT] get Windows user profile path with forward slashes"
      command: "wslpath -m '{{ win_profile_unix.stdout }}'"
      register: win_profile_mixed
      changed_when: false

    - name: "[ENVIRONMENT] create Windows .ssh directory"
      file:
        path: "{{ win_profile_unix.stdout }}/.ssh"
        state: directory

    - name: "[ENVIRONMENT] write work public key so ssh.exe can pick it from the 1Password agent"
      copy:
        content: "{{ lookup('onepassword', 'op://Trabajo/securitas ed25519/public key') }}\n"
        dest: "{{ win_profile_unix.stdout }}/.ssh/securitas_ed25519.pub"

    - name: "[ENVIRONMENT] configure ssh entries (Windows)"
      blockinfile:
        path: "{{ win_profile_unix.stdout }}/.ssh/config"
        marker: "# {mark} ANSIBLE MANAGED BLOCK work hosts #"
        block: "{{ lookup('template', 'windows_ssh_config.j2') }}"
        create: true

- name: "[ENVIRONMENT] export RSA key"
  copy:
    content: "{{ lookup('onepassword', 'op://Trabajo/securitas_rsa/clave privada') }}"
    dest: "{{ ansible_user_dir }}/.ssh/securitas_rsa"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0600
  
