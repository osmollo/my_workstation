---

- name: "[DOCKER] Create docker directories"
  become: true
  file:
    path: "{{ item.path }}"
    state: directory
    mode: 0750
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  loop:
    - path: "/home/{{ ansible_user }}/.docker"
      owner: "{{ ansible_user }}"
    - path: "/etc/docker"
      owner: root

- name: "[DOCKER] read current config.json"
  slurp:
    src: "/home/{{ ansible_user }}/.docker/config.json"
  register: docker_config_slurp
  failed_when: false

- name: "[DOCKER] merge registry credentials into config.json"
  template:
    src: docker_config.json.j2
    dest: "/home/{{ ansible_user }}/.docker/config.json"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0600
  vars:
    docker_existing_config: "{{ (docker_config_slurp.content | b64decode | from_json) if docker_config_slurp.content is defined else {} }}"

- name: "[DOCKER] create daemon.json"
  become: true
  become_method: sudo
  copy:
    content: |
      {
        "insecure-registries": {{ docker_registries | selectattr('insecure', 'defined') | map(attribute='name') | to_json }}
      }
    dest: /etc/docker/daemon.json
    mode: 0644
    owner: root
    group: root

- name: "[DOCKER] Create certs.d directory for each registry"
  become: true
  file:
    path: "/etc/docker/certs.d/{{ item }}"
    state: directory
    mode: 0755
    owner: root
    group: root
  loop: "{{ docker_registries | selectattr('ca_cert', 'defined') | map(attribute='name') | list }}"

- name: "[DOCKER] Trust the CA of each registry"
  become: true
  copy:
    content: "{{ item.ca_cert }}"
    dest: "/etc/docker/certs.d/{{ item.name }}/ca.crt"
    mode: 0644
    owner: root
    group: root
  loop: "{{ docker_registries | selectattr('ca_cert', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: "[DOCKER] Restart docker"
  become: true
  become_method: sudo
  systemd:
    name: docker
    state: restarted
