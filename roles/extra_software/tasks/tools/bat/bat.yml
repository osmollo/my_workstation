---

- name: "[BAT] install for {{ linux_distribution }}"
  include_tasks: "bat_{{ linux_distribution }}.yml"

- name: "[BAT] create alias"
  vars:
    alias_name: cat
    alias_command: "{{ 'batcat' if linux_distribution in ['debian', 'ubuntu', 'ubuntu_no_snap'] else 'bat' }} --paging=never --decorations=never"
  import_role:
    name: tools/create_alias
