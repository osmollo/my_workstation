---

- name: "[KDENLIVE] [DEB] Install Kdenlive using snap"
  snap:
    name:
      - kdenlive
    classic: true
    state: present
  when: linux_distribution == "ubuntu"
  when: desktop_environment != "kde"

- name: "[KDENLIVE] install kdenlive"
  apt:
    name: kdenlive
    update_cache: true
    state: present
  when: desktop_environment == "kde" or linux_distribution == "ubuntu_no_snap"
