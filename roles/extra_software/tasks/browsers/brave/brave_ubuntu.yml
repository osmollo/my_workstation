---

- name: "[BRAVE] [DEB] install prerequisites"
  apt:
    name:
      - apt-transport-https
      - curl
    state: present
    update_cache: true

- name: "[BRAVE] [DEB] install gpg key"
  get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: "0644"

- name: "[BRAVE] [DEB] install brave repository"
  lineinfile:
    path: /etc/apt/sources.list.d/brave-browser-release.list
    line: "deb [arch=amd64 signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main"
    create: true

- name: "[BRAVE] [DEB] install brave browser"
  apt:
    name: brave-browser
    state: present
    update_cache: true
